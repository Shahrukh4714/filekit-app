<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaserFlow Component Demo — React Bits</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="components/LaserFlow/LaserFlow.css" />
  <script src="js/laser-flow.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0A0A0E;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .demo-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .demo-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFF 0%, #FF79C6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .demo-header p {
      color: #8E8D9A;
      font-size: 14px;
    }
    .demo-container {
      width: 100%;
      max-width: 900px;
      height: 520px;
      position: relative;
      overflow: hidden;
      background-color: #120F17;
      border-radius: 20px;
      border: 1px solid rgba(255, 121, 198, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 121, 198, 0.15);
    }
    .laser-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .interactive-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82%;
      height: 60%;
      background-color: rgba(18, 15, 23, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1.5px solid rgba(255, 121, 198, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 30px;
      z-index: 6;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .interactive-card h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .interactive-card p {
      color: #D1D0D8;
      font-size: 14px;
      max-width: 440px;
      line-height: 1.5;
    }
    .controls-bar {
      margin-top: 24px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-color {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #1A1722;
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 150ms ease;
    }
    .btn-color:hover {
      transform: translateY(-1px);
      border-color: #FF79C6;
    }
  </style>
</head>
<body>

  <div class="demo-header">
    <h1>LaserFlow Component</h1>
    <p>Integrated from React Bits with Three.js &amp; GLSL Volumetric Shaders</p>
  </div>

  <div class="demo-container" id="laser-demo-box">
    <div class="laser-layer" id="laser-mount"></div>

    <div class="interactive-card">
      <h2>LaserFlow Volumetric Shader</h2>
      <p>Move your cursor over this container to see the interactive fog tilt, traveling wisps, and fluid laser beam dynamics.</p>
    </div>
  </div>

  <div class="controls-bar">
    <button class="btn-color" onclick="setLaserColor('#FF79C6')">💖 Neon Pink (#FF79C6)</button>
    <button class="btn-color" onclick="setLaserColor('#8B5CF6')">💜 Electric Purple (#8B5CF6)</button>
    <button class="btn-color" onclick="setLaserColor('#00E5FF')">💎 Cyan Laser (#00E5FF)</button>
    <button class="btn-color" onclick="setLaserColor('#F59E0B')">🔥 Amber Flow (#F59E0B)</button>
    <button class="btn-color" onclick="setLaserColor('#10B981')">💚 Emerald Beam (#10B981)</button>
  </div>

  <script>
    let laserInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      const mount = document.getElementById('laser-mount');
      if (mount && window.createLaserFlow) {
        laserInstance = window.createLaserFlow(mount, {
          horizontalBeamOffset: 0.1,
          verticalBeamOffset: 0.0,
          color: '#FF79C6',
          backgroundColor: '#120F17',
          flowSpeed: 0.35,
          fogIntensity: 0.45,
          wispDensity: 1.0,
          mouseTiltStrength: 0.02
        });
      }
    });

    function setLaserColor(hex) {
      if (laserInstance) {
        laserInstance.updateProps({ color: hex });
        document.querySelector('.interactive-card').style.borderColor = hex;
        document.getElementById('laser-demo-box').style.borderColor = hex + '55';
      }
    }
  </script>
</body>
</html>
