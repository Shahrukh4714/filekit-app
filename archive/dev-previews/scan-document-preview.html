<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileKit Document Scanner & Camera Studio — Interactive Workbench Preview</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/styles.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #090D16;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .preview-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      z-index: 1000;
    }

    .preview-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .preview-logo {
      width: 28px;
      height: 28px;
      background: #10B981;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
    }

    .preview-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }

    .preview-title span {
      color: #10B981;
      font-weight: 500;
      margin-left: 6px;
      font-size: 13px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .preview-state-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .preview-btn {
      padding: 6px 14px;
      border: 0;
      background: transparent;
      color: #94A3B8;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 120ms ease;
    }

    .preview-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
    }

    .preview-btn.active {
      background: #10B981;
      color: #FFFFFF;
      font-weight: 700;
    }

    .preview-container {
      flex: 1;
      height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
  </style>

  <!-- Essential Libs -->
  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/fflate.min.js"></script>
</head>
<body>

  <header class="preview-navbar">
    <div class="preview-brand">
      <div class="preview-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="2" y1="12" x2="22" y2="12" stroke-width="2.5"/><rect x="7" y="7" width="10" height="10" stroke-width="1.5"/></svg>
      </div>
      <div class="preview-title">
        FileKit Scanner Studio <span>Gold-Standard Overhaul Preview</span>
      </div>
    </div>

    <div class="preview-state-switcher">
      <button class="preview-btn active" id="btn-state-dropzone">Stage 1: Dropzone</button>
      <button class="preview-btn" id="btn-state-studio">Stage 3: Review Studio</button>
      <button class="preview-btn" id="btn-state-result">Stage 4: Result Studio</button>
      <button class="preview-btn" id="btn-load-sample" style="background:#047857;color:#fff;">+ Load 3 Sample Docs</button>
    </div>
  </header>

  <main class="preview-container">
    <div id="stage"></div>
  </main>

  <!-- Core App & Tool Scripts -->
  <script src="js/app.js"></script>
  <script src="js/tools-new.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const stage = document.getElementById('stage');
      const btnDz = document.getElementById('btn-state-dropzone');
      const btnStudio = document.getElementById('btn-state-studio');
      const btnResult = document.getElementById('btn-state-result');
      const btnSample = document.getElementById('btn-load-sample');

      function setActiveBtn(btn) {
        [btnDz, btnStudio, btnResult].forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
      }

      // Initial Mount
      window.__ffMountScan(stage);

      btnDz.onclick = () => {
        setActiveBtn(btnDz);
        window.__ffMountScan(stage);
      };

      // Helper to generate sample invoices
      function createSampleDocCanvas(title, pageNum, totalPages) {
        const cv = document.createElement('canvas');
        cv.width = 1240; cv.height = 1754; // A4 150 DPI
        const ctx = cv.getContext('2d');
        
        // Paper background
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, cv.width, cv.height);

        // Header
        ctx.fillStyle = '#0F172A';
        ctx.font = 'bold 36px Outfit, sans-serif';
        ctx.fillText(title, 80, 110);

        ctx.fillStyle = '#10B981';
        ctx.font = 'bold 18px Inter, monospace';
        ctx.fillText('INVOICE #FK-2026-' + (8920 + pageNum), 80, 150);

        ctx.fillStyle = '#64748B';
        ctx.font = '16px Inter, sans-serif';
        ctx.fillText('Issue Date: August 23, 2026   ·   Due: Net 30 Days', 80, 180);

        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(80, 210); ctx.lineTo(cv.width - 80, 210); ctx.stroke();

        // Sample Table
        const startY = 260;
        ctx.fillStyle = '#F8FAFC';
        ctx.fillRect(80, startY, cv.width - 160, 44);
        ctx.fillStyle = '#334155';
        ctx.font = 'bold 15px Inter, sans-serif';
        ctx.fillText('ITEM DESCRIPTION', 100, startY + 28);
        ctx.fillText('QTY', 700, startY + 28);
        ctx.fillText('UNIT PRICE', 840, startY + 28);
        ctx.fillText('TOTAL AMOUNT', 1000, startY + 28);

        const items = [
          ['High-Precision Optical Document Sensor Kit', '1', '$1,250.00', '$1,250.00'],
          ['Sub-Pixel Perspective Warp Engine License', '3', '$450.00', '$1,350.00'],
          ['On-Device Multilingual OCR Language Model (SIMD)', '1', '$890.00', '$890.00'],
          ['Adaptive Illumination Division Whitening Module', '2', '$320.00', '$640.00'],
          ['Searchable Invisible Font Layer PDF Compiler', '1', '$560.00', '$560.00'],
        ];

        items.forEach((it, idx) => {
          const rowY = startY + 54 + idx * 48;
          ctx.strokeStyle = '#F1F5F9';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(80, rowY + 36); ctx.lineTo(cv.width - 80, rowY + 36); ctx.stroke();

          ctx.fillStyle = '#1E293B';
          ctx.font = '15px Inter, sans-serif';
          ctx.fillText(it[0], 100, rowY + 24);
          ctx.fillText(it[1], 700, rowY + 24);
          ctx.fillText(it[2], 840, rowY + 24);
          ctx.fillStyle = '#0F172A';
          ctx.font = 'bold 15px Inter, sans-serif';
          ctx.fillText(it[3], 1000, rowY + 24);
        });

        // Totals Box
        ctx.fillStyle = '#F8FAFC';
        ctx.fillRect(cv.width - 440, startY + 360, 360, 140);
        ctx.strokeStyle = '#E2E8F0';
        ctx.strokeRect(cv.width - 440, startY + 360, 360, 140);

        ctx.fillStyle = '#64748B';
        ctx.font = '14px Inter, sans-serif';
        ctx.fillText('Subtotal:', cv.width - 410, startY + 395);
        ctx.fillText('Tax (8.5%):', cv.width - 410, startY + 430);
        ctx.fillStyle = '#0F172A';
        ctx.font = 'bold 18px Inter, sans-serif';
        ctx.fillText('Total Balance Due:', cv.width - 410, startY + 475);

        ctx.font = '14px Inter, sans-serif';
        ctx.fillText('$4,690.00', cv.width - 180, startY + 395);
        ctx.fillText('$398.65', cv.width - 180, startY + 430);
        ctx.fillStyle = '#10B981';
        ctx.font = 'bold 18px Outfit, sans-serif';
        ctx.fillText('$5,088.65', cv.width - 180, startY + 475);

        // Footer
        ctx.fillStyle = '#94A3B8';
        ctx.font = '13px Inter, sans-serif';
        ctx.fillText(`Digitized on-device with FileKit Studio  ·  Page ${pageNum} of ${totalPages}`, 80, cv.height - 80);

        return cv;
      }

      async function loadSampleDocuments() {
        const c1 = createSampleDocCanvas('Official Procurement Invoice', 1, 3);
        const c2 = createSampleDocCanvas('Hardware Logistics & Delivery Slip', 2, 3);
        const c3 = createSampleDocCanvas('Service Level Agreement (SLA)', 3, 3);

        window.__ffMountScan(stage);
        
        // Access scan state through container simulation
        const inp = stage.querySelector('#scan-file-input');
        
        // Convert canvases to blobs & pass directly into ingestion
        const b1 = await new Promise(r => c1.toBlob(r, 'image/png'));
        const b2 = await new Promise(r => c2.toBlob(r, 'image/png'));
        const b3 = await new Promise(r => c3.toBlob(r, 'image/png'));

        const f1 = new File([b1], 'procurement-invoice.png', { type: 'image/png' });
        const f2 = new File([b2], 'delivery-slip.png', { type: 'image/png' });
        const f3 = new File([b3], 'service-agreement.png', { type: 'image/png' });

        const dt = new DataTransfer();
        dt.items.add(f1); dt.items.add(f2); dt.items.add(f3);
        inp.files = dt.files;
        inp.dispatchEvent(new Event('change', { bubbles: true }));

        setActiveBtn(btnStudio);
      }

      btnSample.onclick = loadSampleDocuments;

      btnStudio.onclick = async () => {
        await loadSampleDocuments();
        setActiveBtn(btnStudio);
      };

      btnResult.onclick = async () => {
        await loadSampleDocuments();
        setTimeout(() => {
          const exportBtn = stage.querySelector('#btn-main-export');
          if (exportBtn) exportBtn.click();
          setActiveBtn(btnResult);
        }, 300);
      };
    });
  </script>
</body>
</html>
