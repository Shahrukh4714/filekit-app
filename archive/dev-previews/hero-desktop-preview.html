<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FileKit — Desktop hero preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #CBD5E1; }
  .frame {
    width: 1440px;
    height: 940px;
    border: 0;
    display: block;
    transform: scale(0.22);
    transform-origin: top left;
    box-shadow: 0 30px 80px rgba(15, 23, 42, 0.35);
    background: #fff;
  }
</style>
</head>
<body>
<iframe class="frame" src="http://127.0.0.1:8000/" title="FileKit homepage at 1440px desktop width"></iframe>
</body>
</html>
