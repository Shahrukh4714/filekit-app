<rect x="405" y="210" width="132" height="504" fill="#FAFBFC"/><path d="M537 210v504" stroke="#E7EAF0" stroke-width="2"/>
<g font-family="Arial" font-size="10" fill="#667085">
 <g transform="translate(425 236)"><rect width="90" height="91" rx="5" fill="#fff" stroke="#0055FF" stroke-width="2"/><rect x="13" y="14" width="64" height="7" rx="3" fill="#E9EDF2"/><rect x="13" y="30" width="48" height="6" rx="3" fill="#E9EDF2"/><rect x="13" y="49" width="64" height="27" rx="3" fill="#DDF3FD"/><circle cx="8" cy="8" r="8" fill="#0055FF"/><text x="8" y="11" text-anchor="middle" fill="#fff" font-weight="700">1</text></g>
 <g transform="translate(425 346)"><rect width="90" height="91" rx="5" fill="#fff" stroke="#DCE1E8"/><rect x="13" y="13" width="64" height="51" rx="3" fill="#DDF3FD"/><path d="M13 64l23-24 18 17 11-12 12 19" fill="#0055FF"/><rect x="13" y="73" width="51" height="6" rx="3" fill="#E9EDF2"/><circle cx="8" cy="8" r="8" fill="#98A2B3"/><text x="8" y="11" text-anchor="middle" fill="#fff" font-weight="700">2</text></g>
 <g transform="translate(425 456)"><rect width="90" height="91" rx="5" fill="#fff" stroke="#DCE1E8"/><path d="M14 27h62M14 44h62M14 61h62M34 16v58M57 16v58" stroke="#A5DDBD" stroke-width="3"/><circle cx="8" cy="8" r="8" fill="#98A2B3"/><text x="8" y="11" text-anchor="middle" fill="#fff" font-weight="700">3</text></g>
</g>
<!-- polished page preview -->
<rect x="579" y="245" width="285" height="389" fill="#fff" stroke="#DDE2E8" stroke-width="2" filter="url(#soft)"/>
<rect x="608" y="276" width="178" height="11" rx="5" fill="#D8F1FC"/><rect x="608" y="300" width="220" height="8" rx="4" fill="#EDF0F4"/><rect x="608" y="319" width="196" height="8" rx="4" fill="#EDF0F4"/>
<rect x="608" y="355" width="227" height="112" rx="5" fill="#E3F6FD"/><circle cx="785" cy="382" r="17" fill="#FFBE32"/><path d="M608 467l65-69 45 42 30-32 87 59z" fill="#3CA8E3"/>
<rect x="608" y="493" width="227" height="8" rx="4" fill="#EDF0F4"/><rect x="608" y="514" width="210" height="8" rx="4" fill="#EDF0F4"/><rect x="608" y="535" width="221" height="8" rx="4" fill="#EDF0F4"/>
<rect x="608" y="566" width="89" height="37" rx="5" fill="#EAFBF3"/><path d="M620 590l12-12 10 7 14-16 24 21" fill="none" stroke="#18B956" stroke-width="3"/>
<rect x="715" y="568" width="120" height="7" rx="3.5" fill="#EDF0F4"/><rect x="715" y="587" width="98" height="7" rx="3.5" fill="#EDF0F4"/>
<!-- ready chip -->
<g transform="translate(741 614)" filter="url(#soft)"><rect width="116" height="39" rx="19.5" fill="#fff" stroke="#DCE1E8"/><circle cx="20" cy="20" r="10" fill="#DDF8EA"/><path d="M16 20l3 3 6-7" fill="none" stroke="#12B76A" stroke-width="2"/><text x="39" y="24" font-family="Arial" font-size="11" font-weight="700" fill="#0055FF">Ready to export</text></g>
<!-- finished output file -->
<g transform="translate(923 281)" filter="url(#soft)"><path d="M0 0h101l31 31v135H0z" fill="#fff" stroke="#DDE2E8" stroke-width="2"/><path d="M101 0v31h31" fill="#F4F6F8" stroke="#DDE2E8" stroke-width="2"/><rect x="-10" y="61" width="80" height="42" rx="8" fill="url(#blue)"/><text x="30" y="89" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">DONE</text><circle cx="96" cy="126" r="22" fill="#DDF8EA"/><path d="M86 126l7 7 14-17" fill="none" stroke="#12B76A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M876 353h50m-16-16 17 16-17 16" fill="none" stroke="#8A9098" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<!-- floating action icons -->
<g transform="translate(896 566)" filter="url(#soft)"><rect width="76" height="76" rx="14" fill="url(#purple)"/><path d="M22 23h22v28H22zM32 17h22v28M27 37h22" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></g>
<g transform="translate(989 635)" filter="url(#soft)"><rect width="76" height="76" rx="14" fill="url(#coral)"/><path d="M22 22h32v32H22zM38 22v32M22 38h32" fill="none" stroke="#fff" stroke-width="3"/></g>
