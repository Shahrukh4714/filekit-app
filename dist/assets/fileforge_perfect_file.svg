<g fill="none" stroke-linecap="round"><circle cx="1084" cy="528" r="8" stroke="#FFB800" stroke-width="5"/><path d="M1089 216v22m-11-11h22" stroke="#A9DDF5" stroke-width="4"/><path d="M134 703l13 13m0-13-13 13" stroke="#0055FF" stroke-width="4"/><path d="M1044 760l10 10m0-10-10 10" stroke="#FF496C" stroke-width="4"/></g>
