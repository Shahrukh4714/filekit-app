<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Create the perfect file with FileKit</title>
<desc id="desc">PDF, image, spreadsheet and audio files flow into an arranging workspace and become one polished finished document.</desc>
<defs>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#172B4D" flood-opacity=".13"/></filter>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172B4D" flood-opacity=".14"/></filter>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#52B6EA"/><stop offset="1" stop-color="#0055FF"/></linearGradient>
 <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF627D"/><stop offset="1" stop-color="#EE3049"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8D6BF1"/><stop offset="1" stop-color="#6950DC"/></linearGradient>
</defs>
<rect width="1200" height="900" fill="none"/>
<!-- background -->
<rect x="95" y="89" width="420" height="535" rx="48" fill="#EAF8FE" transform="rotate(-16 305 356)"/>
<rect x="711" y="77" width="350" height="410" rx="46" fill="#F6F8FC" transform="rotate(18 886 282)"/>
<rect x="804" y="523" width="250" height="235" rx="38" fill="#F8FAFD" transform="rotate(-12 929 640)"/>
<!-- source file stack -->
<g filter="url(#soft)">
 <g transform="translate(105 180) rotate(-7)"><path d="M0 0h111l31 31v142H0z" fill="#fff" stroke="#E1E5EA" stroke-width="2"/><path d="M111 0v31h31" fill="#F4F6F8" stroke="#E1E5EA" stroke-width="2"/><rect x="-9" y="60" width="73" height="39" rx="7" fill="#EE3049"/><text x="27" y="87" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">PDF</text><g fill="#EDF0F4"><rect x="23" y="118" width="91" height="8" rx="4"/><rect x="23" y="138" width="72" height="8" rx="4"/></g></g>
 <g transform="translate(91 360) rotate(4)"><path d="M0 0h104l29 29v133H0z" fill="#fff" stroke="#E1E5EA" stroke-width="2"/><path d="M104 0v29h29" fill="#F4F6F8" stroke="#E1E5EA" stroke-width="2"/><rect x="17" y="54" width="98" height="72" rx="5" fill="#DDF3FD"/><circle cx="91" cy="72" r="10" fill="#FFB800"/><path d="M17 126l31-35 23 23 16-17 28 29z" fill="#0055FF"/></g>
 <g transform="translate(217 520) rotate(-5)"><path d="M0 0h102l28 28v125H0z" fill="#fff" stroke="#E1E5EA" stroke-width="2"/><path d="M102 0v28h28" fill="#F4F6F8" stroke="#E1E5EA" stroke-width="2"/><rect x="-7" y="52" width="72" height="37" rx="7" fill="#18B956"/><text x="29" y="78" text-anchor="middle" fill="#fff" font-family="Arial" font-size="20" font-weight="700">XLSX</text><path d="M24 108h82M24 127h82M51 98v44M80 98v44" fill="none" stroke="#DDE3E8" stroke-width="3"/></g>
</g>
<!-- flow paths -->
<g fill="none" stroke="#A9DDF5" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14"><path d="M270 255c86 0 113 49 143 108"/><path d="M246 440c88 0 118-15 169-44"/><path d="M351 608c60-37 63-91 78-154"/></g>
<path d="M399 344l16 19-24 2M393 399l22-3-8 21M416 475l13-20 11 21" fill="none" stroke="#A9DDF5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<!-- arranging workspace -->
<g filter="url(#shadow)"><rect x="405" y="152" width="505" height="562" rx="7" fill="#fff" stroke="#DCE1E8" stroke-width="2"/></g>
<rect x="405" y="152" width="505" height="58" rx="7" fill="#fff"/><path d="M405 210h505" stroke="#E7EAF0" stroke-width="2"/>
<g transform="translate(429 166)"><rect width="32" height="32" rx="8" fill="#fff" stroke="#CBD5E1"/><rect x="4" y="4" width="11" height="13" rx="2" fill="#FF4D4D"/><rect x="17" y="4" width="11" height="9" rx="2" fill="#FFC700"/><rect x="17" y="15" width="11" height="13" rx="2" fill="#00E676"/><rect x="4" y="19" width="11" height="9" rx="2" fill="#00B0FF"/></g>
<text x="470" y="183" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#17191C">Arrange &amp; combine</text>
<text x="470" y="199" font-family="Inter,Arial" font-size="10" fill="#8A94A3">3 source files · drag to reorder</text>
<rect x="788" y="169" width="97" height="25" rx="12.5" fill="#EAFBF3"/><circle cx="803" cy="182" r="4" fill="#12B76A"/><text x="814" y="186" font-family="Arial" font-size="9" font-weight="700" fill="#087443">LOCAL</text>
