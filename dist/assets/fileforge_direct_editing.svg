<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">FileKit direct file editing</title>
<desc id="desc">A clean browser editor showing image cropping, text editing, annotation and privacy controls.</desc>
<defs>
 <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#172B4D" flood-opacity=".13"/></filter>
 <filter id="floatShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172B4D" flood-opacity=".16"/></filter>
 <linearGradient id="blueTile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#52B6EA"/><stop offset="1" stop-color="#0055FF"/></linearGradient>
 <linearGradient id="pinkTile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF627D"/><stop offset="1" stop-color="#EE3049"/></linearGradient>
 <linearGradient id="purpleTile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8D6BF1"/><stop offset="1" stop-color="#6950DC"/></linearGradient>
</defs>
<rect width="1200" height="900" fill="none"/>
<!-- quiet background geometry -->
<rect x="596" y="38" width="370" height="410" rx="48" fill="#EAF8FE" transform="rotate(-24 781 243)"/>
<rect x="846" y="116" width="220" height="300" rx="38" fill="#F6F8FC" transform="rotate(17 956 266)"/>
<rect x="84" y="534" width="300" height="250" rx="42" fill="#F8FAFD" transform="rotate(-15 234 659)"/>
<!-- editor window -->
<g filter="url(#panelShadow)">
 <rect x="154" y="142" width="862" height="594" rx="5" fill="#fff" stroke="#DCE1E8" stroke-width="2"/>
</g>
<!-- app header -->
<rect x="154" y="142" width="862" height="62" rx="5" fill="#fff"/>
<path d="M154 204h862" stroke="#E8EBF0" stroke-width="2"/>
<g transform="translate(178 158)">
 <rect width="32" height="32" rx="8" fill="#fff" stroke="#CBD5E1"/>
 <rect x="4" y="4" width="11" height="13" rx="2" fill="#FF4D4D"/>
 <rect x="17" y="4" width="11" height="9" rx="2" fill="#FFC700"/>
 <rect x="17" y="15" width="11" height="13" rx="2" fill="#00E676"/>
 <rect x="4" y="19" width="11" height="9" rx="2" fill="#00B0FF"/>
</g>
<text x="221" y="174" fill="#17191C" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">Edit file</text>
<text x="221" y="191" fill="#8A94A3" font-family="Inter,Arial,sans-serif" font-size="11">photo-project.png</text>
<rect x="874" y="159" width="112" height="29" rx="14.5" fill="#EAFBF3"/>
<circle cx="892" cy="174" r="4" fill="#12B76A"/>
<text x="905" y="178" fill="#087443" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">LOCAL</text>
<!-- toolbar -->
<rect x="154" y="204" width="862" height="62" fill="#FAFBFC"/>
<path d="M154 266h862" stroke="#E8EBF0" stroke-width="2"/>
<g fill="#fff" stroke="#E1E5EA">
 <rect x="179" y="218" width="38" height="34" rx="5" fill="#E5F6FD" stroke="none"/>
 <rect x="225" y="218" width="38" height="34" rx="5"/><rect x="271" y="218" width="38" height="34" rx="5"/>
 <rect x="317" y="218" width="38" height="34" rx="5"/><rect x="363" y="218" width="38" height="34" rx="5"/>
 <rect x="409" y="218" width="38" height="34" rx="5"/>
 <rect x="851" y="218" width="38" height="34" rx="5"/><rect x="897" y="218" width="38" height="34" rx="5"/><rect x="943" y="218" width="38" height="34" rx="5"/>
</g>
<g fill="none" stroke="#344054" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
 <path d="M191 227l13 6-6 3 4 8-3 1-4-8-4 3z"/>
 <path d="M235 244l15-15m-12 18l-4-4 14-14 4 4z"/>
 <path d="M282 229h16M290 229v16M285 245h10"/>
 <path d="M327 229h18v14h-18z"/>
 <circle cx="380" cy="235" r="6"/><path d="M371 245l6-6 5 4 4-3 7 5"/>
 <path d="M420 228h16M428 228v18"/>
 <path d="M860 240c-4-9 3-15 12-12m-5-4 5 4-4 5"/>
 <path d="M926 240c4-9-3-15-12-12m5-4-5 4 4 5"/>
 <circle cx="962" cy="235" r="6"/><path d="M967 240l5 5"/>
</g>
<!-- canvas area -->
<rect x="154" y="266" width="862" height="470" fill="#F4F5F7"/>
<g filter="url(#floatShadow)"><rect x="246" y="309" width="678" height="376" fill="#fff" stroke="#DDE1E6" stroke-width="2"/></g>
<!-- image and content inside document -->
<g fill="#EEF1F4">
 <rect x="298" y="355" width="310" height="10" rx="5"/><rect x="298" y="380" width="270" height="9" rx="4.5"/>
 <rect x="298" y="405" width="224" height="9" rx="4.5"/>
 <rect x="298" y="529" width="558" height="9" rx="4.5"/><rect x="298" y="554" width="520" height="9" rx="4.5"/>
 <rect x="298" y="579" width="543" height="9" rx="4.5"/><rect x="298" y="604" width="470" height="9" rx="4.5"/>
</g>
<!-- selected photo -->
<rect x="658" y="344" width="178" height="150" rx="3" fill="#DDF3FD"/>
<circle cx="787" cy="379" r="20" fill="#FFBE32"/>
<path d="M658 474l52-57 38 37 24-27 64 67H658z" fill="#0055FF" opacity=".86"/>
<path d="M658 344h178v150H658z" fill="none" stroke="#0055FF" stroke-width="2"/>
<g fill="#fff" stroke="#0055FF" stroke-width="2">
 <rect x="653" y="339" width="10" height="10"/><rect x="831" y="339" width="10" height="10"/>
 <rect x="653" y="489" width="10" height="10"/><rect x="831" y="489" width="10" height="10"/>
 <rect x="742" y="339" width="10" height="10"/><rect x="742" y="489" width="10" height="10"/>
</g>
<!-- selected text -->
<text x="317" y="472" fill="#344054" font-family="Inter,Arial,sans-serif" font-size="25">Edit directly.</text>
<rect x="300" y="442" width="188" height="45" fill="none" stroke="#0055FF" stroke-width="2"/>
<g fill="#fff" stroke="#0055FF" stroke-width="2"><rect x="295" y="437" width="10" height="10"/><rect x="483" y="437" width="10" height="10"/><rect x="295" y="482" width="10" height="10"/><rect x="483" y="482" width="10" height="10"/></g>
<!-- annotation -->
<path d="M486 640c21-45 44 36 69-5 20-33 29 33 55-7 15-23 35 19 53-4" fill="none" stroke="#FF496C" stroke-width="4" stroke-linecap="round"/>
<rect x="472" y="620" width="205" height="41" fill="none" stroke="#0055FF" stroke-width="2"/>
<g fill="#fff" stroke="#0055FF" stroke-width="2"><rect x="467" y="615" width="10" height="10"/><rect x="672" y="615" width="10" height="10"/><rect x="467" y="656" width="10" height="10"/><rect x="672" y="656" width="10" height="10"/></g>
<!-- floating action tiles -->
<g transform="translate(940 546)" filter="url(#floatShadow)"><rect width="76" height="76" rx="14" fill="url(#purpleTile)"/><path d="M23 24h30v28H23zM29 18h30v28M37 29v18M28 38h18" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></g>
<g transform="translate(1010 625)" filter="url(#floatShadow)"><rect width="76" height="76" rx="14" fill="url(#pinkTile)"/><path d="M20 51l12-28h12l12 28M25 40h26" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="51" cy="25" r="5" fill="#fff"/></g>
<g transform="translate(905 670)" filter="url(#floatShadow)"><rect width="76" height="76" rx="14" fill="url(#blueTile)"/><path d="M24 23h28v30H24zM31 17h28v30" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></g>
<!-- understated accents -->
<g fill="none" stroke-linecap="round"><circle cx="1056" cy="542" r="8" stroke="#FFB800" stroke-width="5"/><path d="M111 451l14 14m0-14-14 14" stroke="#0055FF" stroke-width="4"/><path d="M1084 250v22m-11-11h22" stroke="#A9DDF5" stroke-width="4"/><path d="M123 171v18m-9-9h18" stroke="#FF496C" stroke-width="4"/></g>
</svg>