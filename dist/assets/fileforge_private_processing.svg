<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Private local file processing</title>
<desc id="desc">Files remain protected inside a local browser workspace with no uploads.</desc>
<defs>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#172B4D" flood-opacity=".13"/></filter>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172B4D" flood-opacity=".14"/></filter>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22C985"/><stop offset="1" stop-color="#00A66F"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#52B6EA"/><stop offset="1" stop-color="#0055FF"/></linearGradient>
 <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF627D"/><stop offset="1" stop-color="#EE3049"/></linearGradient>
</defs>
<rect width="1200" height="900" fill="none"/>
<!-- soft background -->
<rect x="85" y="106" width="430" height="500" rx="52" fill="#EAF8FE" transform="rotate(-17 300 356)"/>
<rect x="720" y="82" width="354" height="400" rx="48" fill="#F6F8FC" transform="rotate(18 897 282)"/>
<rect x="792" y="547" width="262" height="215" rx="40" fill="#F7FBF9" transform="rotate(-12 923 654)"/>
<!-- protection boundary -->
<path d="M600 102c147 61 274 74 334 77v221c0 211-130 326-334 406-204-80-334-195-334-406V179c60-3 187-16 334-77z" fill="#F5FBF8" stroke="#BFEBD8" stroke-width="4" stroke-dasharray="12 13"/>
<!-- browser workspace -->
<g filter="url(#shadow)"><rect x="257" y="187" width="686" height="496" rx="10" fill="#fff" stroke="#DCE1E8" stroke-width="2"/></g>
<rect x="257" y="187" width="686" height="61" rx="10" fill="#fff"/><path d="M257 248h686" stroke="#E7EAF0" stroke-width="2"/>
<circle cx="282" cy="217" r="5" fill="#FF6B6B"/><circle cx="299" cy="217" r="5" fill="#FFB800"/><circle cx="316" cy="217" r="5" fill="#21B781"/>
<g transform="translate(345 201)"><rect width="32" height="32" rx="8" fill="#fff" stroke="#CBD5E1"/><rect x="4" y="4" width="11" height="13" rx="2" fill="#FF4D4D"/><rect x="17" y="4" width="11" height="9" rx="2" fill="#FFC700"/><rect x="17" y="15" width="11" height="13" rx="2" fill="#00E676"/><rect x="4" y="19" width="11" height="9" rx="2" fill="#00B0FF"/></g>
<text x="388" y="220" fill="#17191C" font-family="Inter,Arial" font-size="14" font-weight="700">Private workspace</text>
<rect x="788" y="203" width="127" height="28" rx="14" fill="#EAFBF3"/><circle cx="805" cy="217" r="4" fill="#12B76A"/><text x="817" y="221" fill="#087443" font-family="Arial" font-size="10" font-weight="700">ON THIS DEVICE</text>
<!-- workspace body -->
<rect x="257" y="248" width="686" height="435" fill="#FAFBFC"/>
<!-- central local zone -->
<rect x="305" y="287" width="590" height="342" rx="16" fill="#fff" stroke="#DCE9E3" stroke-width="2"/>
<g transform="translate(531 309)">
 <circle cx="69" cy="69" r="69" fill="#E8FAF2"/>
 <path d="M69 20l42 17v31c0 35-20 58-42 72-22-14-42-37-42-72V37z" fill="url(#green)"/>
 <rect x="50" y="65" width="38" height="31" rx="5" fill="none" stroke="#fff" stroke-width="4"/>
 <path d="M57 65V54a12 12 0 0124 0v11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</g>
<text x="600" y="474" text-anchor="middle" fill="#17191C" font-family="Inter,Arial" font-size="20" font-weight="700">Files processed locally</text>
<text x="600" y="499" text-anchor="middle" fill="#667085" font-family="Inter,Arial" font-size="12">Nothing leaves this browser</text>
<!-- files safely inside -->
<g filter="url(#soft)">
 <g transform="translate(336 337) rotate(-5)"><path d="M0 0h76l22 22v93H0z" fill="#fff" stroke="#DFE3E8" stroke-width="2"/><path d="M76 0v22h22" fill="#F4F6F8" stroke="#DFE3E8" stroke-width="2"/><rect x="-7" y="42" width="57" height="31" rx="6" fill="#EE3049"/><text x="22" y="64" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="700">PDF</text></g>
 <g transform="translate(761 339) rotate(5)"><path d="M0 0h76l22 22v93H0z" fill="#fff" stroke="#DFE3E8" stroke-width="2"/><path d="M76 0v22h22" fill="#F4F6F8" stroke="#DFE3E8" stroke-width="2"/><rect x="-7" y="42" width="62" height="31" rx="6" fill="#49ADE5"/><text x="24" y="64" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">DOCX</text></g>
 <g transform="translate(361 505) rotate(4)"><path d="M0 0h72l20 20v87H0z" fill="#fff" stroke="#DFE3E8" stroke-width="2"/><path d="M72 0v20h20" fill="#F4F6F8" stroke="#DFE3E8" stroke-width="2"/><rect x="-7" y="39" width="57" height="29" rx="6" fill="#8B5CF6"/><text x="22" y="60" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">WAV</text></g>
 <g transform="translate(754 508) rotate(-4)"><path d="M0 0h72l20 20v87H0z" fill="#fff" stroke="#DFE3E8" stroke-width="2"/><path d="M72 0v20h20" fill="#F4F6F8" stroke="#DFE3E8" stroke-width="2"/><rect x="-7" y="39" width="59" height="29" rx="6" fill="#18B956"/><text x="23" y="60" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15" font-weight="700">XLSX</text></g>
</g>
<!-- connection lines stop at protection area -->
<g fill="none" stroke="#B7DCCB" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10"><path d="M434 395c41 6 58 20 77 42"/><path d="M765 397c-39 6-57 20-76 41"/><path d="M445 548c37-3 52-16 72-32"/><path d="M754 549c-38-3-52-16-72-32"/></g>
<!-- zero upload panel -->
<g transform="translate(399 600)" filter="url(#soft)"><rect width="402" height="70" rx="14" fill="#fff" stroke="#CDECDD" stroke-width="2"/><circle cx="39" cy="35" r="21" fill="#E5F9EF"/><path d="M29 38l8 8 15-20" fill="none" stroke="#12B76A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="31" fill="#087443" font-family="Inter,Arial" font-size="14" font-weight="700">0 bytes uploaded</text><text x="74" y="50" fill="#667085" font-family="Inter,Arial" font-size="11">Processing stays completely on your device</text></g>
<!-- blocked cloud outside boundary -->
<g transform="translate(949 285)" opacity=".75"><path d="M18 50h54a20 20 0 003-39A29 29 0 0020 20 16 16 0 0018 50z" fill="#fff" stroke="#AEB7C4" stroke-width="3"/><path d="M10 4l74 57" stroke="#FF496C" stroke-width="5" stroke-linecap="round"/></g>
<!-- floating privacy icons -->
<g transform="translate(163 587)" filter="url(#soft)"><rect width="78" height="78" rx="15" fill="url(#green)"/><path d="M39 17l22 9v17c0 17-10 29-22 36-12-7-22-19-22-36V26z" fill="none" stroke="#fff" stroke-width="3"/></g>
<g transform="translate(920 606)" filter="url(#soft)"><rect width="78" height="78" rx="15" fill="url(#blue)"/><rect x="22" y="34" width="34" height="27" rx="4" fill="none" stroke="#fff" stroke-width="3"/><path d="M28 34V25a11 11 0 0122 0v9" fill="none" stroke="#fff" stroke-width="3"/></g>
<g transform="translate(1000 685)" filter="url(#soft)"><rect width="78" height="78" rx="15" fill="url(#coral)"/><path d="M20 39h38M39 20v38M25 25l28 28M53 25L25 53" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
<!-- accents -->
<g fill="none" stroke-linecap="round"><circle cx="1064" cy="535" r="8" stroke="#FFB800" stroke-width="5"/><path d="M111 403l13 13m0-13-13 13" stroke="#0055FF" stroke-width="4"/><path d="M1082 181v22m-11-11h22" stroke="#A9DDF5" stroke-width="4"/><path d="M153 175v20m-10-10h20" stroke="#FF496C" stroke-width="4"/></g>
</svg>