<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop Shadows -->
    <filter id="fk-squircle-shadow" x="-20%" y="-15%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <filter id="fk-pill-shadow" x="-20%" y="-30%" width="150%" height="180%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <!-- Squircle Surface Fill Gradient -->
    <linearGradient id="fk-squircle-surface" x1="256" y1="46" x2="256" y2="466" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F5F9"/>
    </linearGradient>

    <!-- Specular Highlight Overlay -->
    <linearGradient id="fk-pill-specular" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Cyan -> Purple Gradient for Left-Shifted Rows (Row 1 & 3: x=140..328) -->
    <linearGradient id="fk-grad-cyan-purple-left" x1="140" y1="150" x2="328" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="48%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Cyan -> Purple Gradient for Right-Shifted Rows (Row 2 & 4: x=184..372) -->
    <linearGradient id="fk-grad-cyan-purple-right" x1="184" y1="210" x2="372" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="48%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Matching Translucent Ghost Gradient -->
    <linearGradient id="fk-grad-ghost-left" x1="140" y1="150" x2="372" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="fk-grad-ghost-right" x1="184" y1="210" x2="416" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- White iOS Squircle Container -->
  <rect x="46" y="46" width="420" height="420" rx="98" fill="url(#fk-squircle-surface)" filter="url(#fk-squircle-shadow)"/>
  <rect x="46" y="46" width="420" height="420" rx="98" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>

  <!-- ================= ROW 1 (Shifted Left) ================= -->
  <rect x="140" y="132" width="232" height="46" rx="23" fill="url(#fk-grad-ghost-left)"/>
  <g filter="url(#fk-pill-shadow)">
    <rect x="140" y="132" width="188" height="46" rx="23" fill="url(#fk-grad-cyan-purple-left)"/>
    <rect x="142" y="134" width="184" height="22" rx="11" fill="url(#fk-pill-specular)"/>
    <rect x="140.5" y="132.5" width="187" height="45" rx="22.5" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>

  <!-- ================= ROW 2 (Shifted Right) ================= -->
  <rect x="184" y="198" width="232" height="46" rx="23" fill="url(#fk-grad-ghost-right)"/>
  <g filter="url(#fk-pill-shadow)">
    <rect x="184" y="198" width="188" height="46" rx="23" fill="url(#fk-grad-cyan-purple-right)"/>
    <rect x="186" y="200" width="184" height="22" rx="11" fill="url(#fk-pill-specular)"/>
    <rect x="184.5" y="198.5" width="187" height="45" rx="22.5" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>

  <!-- ================= ROW 3 (Shifted Left) ================= -->
  <rect x="140" y="264" width="232" height="46" rx="23" fill="url(#fk-grad-ghost-left)"/>
  <g filter="url(#fk-pill-shadow)">
    <rect x="140" y="264" width="188" height="46" rx="23" fill="url(#fk-grad-cyan-purple-left)"/>
    <rect x="142" y="266" width="184" height="22" rx="11" fill="url(#fk-pill-specular)"/>
    <rect x="140.5" y="264.5" width="187" height="45" rx="22.5" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>

  <!-- ================= ROW 4 (Shifted Right) ================= -->
  <rect x="184" y="330" width="232" height="46" rx="23" fill="url(#fk-grad-ghost-right)"/>
  <g filter="url(#fk-pill-shadow)">
    <rect x="184" y="330" width="188" height="46" rx="23" fill="url(#fk-grad-cyan-purple-right)"/>
    <rect x="186" y="332" width="184" height="22" rx="11" fill="url(#fk-pill-specular)"/>
    <rect x="184.5" y="330.5" width="187" height="45" rx="22.5" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>
</svg>
