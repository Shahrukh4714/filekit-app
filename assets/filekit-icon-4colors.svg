<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop Shadows -->
    <filter id="fk-squircle-shadow" x="-20%" y="-15%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <filter id="fk-pill-shadow" x="-20%" y="-30%" width="150%" height="180%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- Squircle Surface Fill Gradient -->
    <linearGradient id="fk-squircle-surface" x1="256" y1="46" x2="256" y2="466" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F6F9"/>
    </linearGradient>

    <!-- Specular Highlight Overlay -->
    <linearGradient id="fk-pill-specular" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Row 1: Coral Red (PDF) -->
    <linearGradient id="fk-grad-red" x1="130" y1="130" x2="330" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#EA2E2E"/>
    </linearGradient>

    <!-- Row 2: Golden Amber (Images) -->
    <linearGradient id="fk-grad-yellow" x1="170" y1="195" x2="370" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD633"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Row 3: Emerald Green (Local Tools) -->
    <linearGradient id="fk-grad-green" x1="130" y1="260" x2="330" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4EFA9D"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>

    <!-- Row 4: Electric Sky Blue (Doc & Video) -->
    <linearGradient id="fk-grad-sky" x1="170" y1="325" x2="370" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4DC6FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
  </defs>

  <!-- White iOS Squircle Base -->
  <rect x="46" y="46" width="420" height="420" rx="98" fill="url(#fk-squircle-surface)" filter="url(#fk-squircle-shadow)"/>
  <rect x="46" y="46" width="420" height="420" rx="98" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>

  <!-- Row 1: Coral Red (Shifted Left) -->
  <rect x="140" y="132" width="232" height="46" rx="23" fill="#FF4D4D" fill-opacity="0.25"/>
  <g filter="url(#fk-pill-shadow)">
    <rect x="140" y="132" width="188" height="46" rx="23" fill="url(#fk-grad-red)"/>
    <rect x="142" y="134" width="184" height="22" rx="11" fill="url(#fk-pill-specular)"/>
    <rect x="140.5" y="132.5" width="187" height="45" rx="22.5" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>

  <!-- Row 2: Golden Amber (Shifted Right) -->
  <rect x="184" y="198" width="232" height="46" rx="23" fill="#FFC700" fill-opacity="0.25"/>
  <g filter="url(#fk-pill-shadow)">
    <rect x="184" y="198" width="188" height="46" rx="23" fill="url(#fk-grad-yellow)"/>
    <rect x="186" y="200" width="184" height="22" rx="11" fill="url(#fk-pill-specular)"/>
    <rect x="184.5" y="198.5" width="187" height="45" rx="22.5" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>
  </g>

  <!-- Row 3: Emerald Green (Shifted Left) -->
  <rect x="140" y="264" width="232" height="46" rx="23" fill="#00E676" fill-opacity="0.25"/>
  <g filter="url(#fk-pill-shadow)">
    <rect x="140" y="264" width="188" height="46" rx="23" fill="url(#fk-grad-green)"/>
    <rect x="142" y="266" width="184" height="22" rx="11" fill="url(#fk-pill-specular)"/>
    <rect x="140.5" y="264.5" width="187" height="45" rx="22.5" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>

  <!-- Row 4: Electric Sky Blue (Shifted Right) -->
  <rect x="184" y="330" width="232" height="46" rx="23" fill="#00B0FF" fill-opacity="0.25"/>
  <g filter="url(#fk-pill-shadow)">
    <rect x="184" y="330" width="188" height="46" rx="23" fill="url(#fk-grad-sky)"/>
    <rect x="186" y="332" width="184" height="22" rx="11" fill="url(#fk-pill-specular)"/>
    <rect x="184.5" y="330.5" width="187" height="45" rx="22.5" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>
</svg>
